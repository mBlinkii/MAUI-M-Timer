name: Dev Build

# Rolling development build. Runs on every push to main and overwrites the
# prerelease under the fixed tag "dev". release.yml is untouched - it only
# triggers on "v*" tags.
on:
  push:
    # ADAPT 1: default branch
    branches:
      - main
    # ADAPT 2: everything in this repo that is not addon code
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "libs_report.md"
      - "preview/**"
      - "media/**"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Parallel pushes must not overwrite each other; a running job is cancelled
# as soon as a newer one starts.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version and commit info
        id: meta
        run: |
          set -e
          # ADAPT 3: addon folder
          ADDON="MauiMPlusTimer"
          # The committed .toc only carries "git-build", so the base version is
          # the last release tag. "-test" dry-run tags must not count.
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-test' 2>/dev/null || echo "v0.0.0")
          VERSION="${BASE#v}-dev-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Stamp every addon .toc so the build is identifiable as non-release
          # in-game; Libs/ is third-party code.
          for DIR in "$ADDON" "${ADDON}_Options"; do
            find "$DIR" -name '*.toc' -not -path "$DIR/Libs/*" \
              -exec sed -i "s|^## Version:.*|## Version: ${VERSION}|" {} +
          done

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      # ADAPT 4: library set - must stay identical to release.yml.
      # Libs/ is not tracked, so the dev build fetches the same set as release.yml.
      - name: Fetch Ace3 + helper libraries into Libs/
        run: |
          set -e
          # Runtime libs go into the main addon, settings-only libs into the
          # load-on-demand MauiMPlusTimer_Options (BlinkiiOptions is tracked there).
          LIBS="MauiMPlusTimer/Libs"
          OPT="MauiMPlusTimer_Options/Libs"
          mkdir -p "$LIBS" "$OPT"

          svn export --force https://repos.curseforge.com/wow/libstub/trunk "$LIBS/LibStub"
          svn export --force https://repos.curseforge.com/wow/callbackhandler/trunk/CallbackHandler-1.0 "$LIBS/CallbackHandler-1.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceAddon-3.0 "$LIBS/AceAddon-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceEvent-3.0 "$LIBS/AceEvent-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceConsole-3.0 "$LIBS/AceConsole-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceTimer-3.0 "$LIBS/AceTimer-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceDB-3.0 "$LIBS/AceDB-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceLocale-3.0 "$LIBS/AceLocale-3.0"
          svn export --force https://repos.curseforge.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0 "$LIBS/LibSharedMedia-3.0"

          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceDBOptions-3.0 "$OPT/AceDBOptions-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceGUI-3.0 "$OPT/AceGUI-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceConfig-3.0 "$OPT/AceConfig-3.0"

          git clone --depth 1 https://github.com/rossnichols/LibSerialize.git "$OPT/LibSerialize"
          rm -rf "$OPT/LibSerialize/.git"
          git clone --depth 1 https://github.com/SafeteeWoW/LibDeflate.git "$OPT/LibDeflate"
          rm -rf "$OPT/LibDeflate/.git"

      # ADAPT 5: zip name - constant, otherwise the download URL changes per run.
      - name: Build zip
        run: |
          rm -f MauiMPlusTimer/.pkgmeta
          # Zip from the repo root so both addon folders are top-level entries.
          zip -r "MauiMPlusTimer-dev.zip" "MauiMPlusTimer" "MauiMPlusTimer_Options" -x "*/.git*" "*/.svn/*"

      # ADAPT 6: addon name and repo URL in the notice below
      - name: Write release notes
        run: |
          cat > DEV_NOTES.md <<'HEADER'
          > ⚠️ **Untested development build.** Built automatically on every push to `main` and not verified in-game. For a stable version please use the latest [Release](https://github.com/mBlinkii/MAUI-M-Timer/releases/latest).

          HEADER
          {
            echo "**Version:** ${{ steps.meta.outputs.version }}"
            echo "**Commit:** ${GITHUB_SHA}"
            echo "**Built:** $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo
            echo '## Latest commit'
            echo
            echo '```'
            git log -1 --pretty=%B
            echo '```'
          } >> DEV_NOTES.md

      # Tag and prerelease are re-set on every run; the asset keeps its name so
      # the download URL stays stable.
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: MAUI M+ Timer Development Build
          body_path: DEV_NOTES.md
          files: MauiMPlusTimer-dev.zip
          prerelease: true
          make_latest: false
